<script>let ev=null;addEventListener("beforeinstallprompt",e=>{e.preventDefault();ev=e;const b=document.getElementById("inst");b.hidden=false;document.getElementById("how").textContent="Tap the button to put Well Now on your home screen with its own icon.";b.onclick=async()=>{ev.prompt();await ev.userChoice;b.hidden=true;};});
